<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>浮动-清除浮动</title>
<style>
.top {
  margin: 10px auto;
  width: 1200px;
  /* height: 300px; */
  background-color: pink;
  /* 方法4：overflow: hidden; 清除浮动（简单） */
  /* overflow: hidden; */
}
.left {
  width: 200px;
  height: 300px;
  background-color: skyblue;
  float: left; /* 左浮动 */
}
.right {
  width: 980px;
  height: 300px;
  background-color: orange;
  float: right; /* 右浮动 */
}
.bottom {
  height: 100px;
  background-color: brown;
}

/* 方法2：单伪元素清除浮动（企业最常用） */
/* /* .clearfix::after {
  content: "";
  display: block;
  clear: both; }*/


/* 方法1：额外标签法 */
/* .clearfix {
    clear: both;
} 
要在父级标签内添加子集标签    
*/

/* before 解决外边距塌陷问题 */
/* 方法3：双伪元素法 (推荐) */
.clearfix::before,
.clearfix::after {
    content: "";
    display: table;
}

/* after清除浮动 */
.clearfix::after {
    clear: both;
}
</style>
</head>
<body>
<div class="top clearfix">
  <div class="left"></div>
  <div class="right"></div>
  <!-- <div class="clearfix"></div>    方法一 -->
</div>
<div class="bottom"></div>
</body>
</html>
