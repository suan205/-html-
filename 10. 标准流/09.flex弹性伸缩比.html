<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
.box {
  display: flex;
  flex-direction: column; /* 主轴：垂直方向（上下） */
  height: 300px;
  border: 1px solid #000;
}
.box div {
  background-color: pink;
}
.box div:nth-child(1) {
  width: 200px;
  /* 没有写 flex，不参与瓜分剩余空间，高度由内容撑开 */
}
.box div:nth-child(2) {
  flex: 1; /* 占1份 */
}
.box div:nth-child(3) {
  flex: 2; /* 占2份 */
}
</style>
</head>
<body>
<div class="box">
  <div>1</div>
  <div>2</div>
  <div>3</div>
</div>
</body>
</html>
