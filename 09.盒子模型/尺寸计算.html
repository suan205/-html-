<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>尺寸计算</title>
    <style>
        div {
             width: 240px;
            height: 240px;
            /* 手动减法 */
            /* height 200px; */
            /* width:: 160px;  */
            background-color: pink;

            padding: 20px;

            /* 内减模式：加padding和border不会撑大盒子 */
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <div>div 标签</div>
</body>
</html>
