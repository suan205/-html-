<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>单方向边框线</title>
    <style>
        div {
             width: 200px;
            height: 200px;
            background-color: pink;
            border-top: 1px solid #000;
            border-right: 2px dashed #820202;
            border-bottom: 5px dotted #326f18;
            border-left: 3px solid #8ea62d;
        }
    </style>
</head>
<body>
    <div>div 标签</div>
</body>
</html>
