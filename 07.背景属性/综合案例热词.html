<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>热词</title>
    <style>
        /* 默认效果 */
        a {
            display: block;
            width: 200px;
            height: 80px;
            background-color: rgb(51, 51, 111);
            color: beige;
            text-decoration: none;
            text-align: center;
            line-height: 80px;
            font-size: 18px;
        }
        /* 鼠标悬停的效果 */
        a:hover {
            background-color: rgb(170, 170, 226);
        }
    </style>
</head>
<body>
    <a href="#">HTML</a>
    <a href="#">CSS</a>
    <a href="#">JavaScript</a>
    <a href="#">Vue</a>
    <a href="#">React</a>
</body>
</html>
