<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>banner效果</title>
    <style>
        .banner {
            width: 70%;
            height: 400px;
            background-color: beige;
            background-image: url(../扣完的贴纸图.png);
            background-repeat: no-repeat;
            background-position: left bottom;
            background-size: contain;

            /* 文字控制属性，继承给子集 */
            text-align: right;
            color: chocolate;
        }

        .banner h2 {
            font-size: 36px;
            font-weight: 400;
            line-height: 100px;

        }

        .banner p {
            font-size: 20px;
        }

        .banner a {
            width: 125px;
            height: 40px;
            background-color: pink;

            display: inline-block;
            /* 转块级无法右对齐，因为块元素独占一行 */
            /* display: block; */

            text-align: center;
            line-height: 40px;
            color: aliceblue;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="banner">
    <h2>让创造产生价值</h2>
    <p>我们希望小游戏平台可以提供无限的可能性，让每一个创作者</p>
    <a href="#">我要报名</a>
    </div>

</body>
</html>
