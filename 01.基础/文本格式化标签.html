<body>
    <!-- 加粗 -->
    <strong>花怜</strong>
    <b>花怜</b>

    <!-- 斜体 -->
    <em>冰秋</em>

    <!-- 下划线 -->
    <ins>忘羡</ins>
    <u>忘羡</u>
    <br>
    <del>删除线</del>
    <s>删除线</s>

</body>
