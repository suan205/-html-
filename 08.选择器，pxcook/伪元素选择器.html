<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>伪元素选择器</title>
    <!-- 1.必须写content:""，这是伪元素生效的前提；不需要文字的时候，引号里面空着就行content: "";
         2. 伪元素默认是 行内（inline）模式 → 默认 不能直接设置宽高 ，想要设置宽高，
         要改成 display: inline-block;或者block;
         3. 选择器权重：和 标签选择器一样 （很低） -->
    <style>
        div {
            width: 300px;
            height: 300px;
            background-color: black;
        }

        div::before {
            content: "老鼠";

            width: 100px;
            height: 100px;
            background-color: yellow;
            display: block;
        }

        div::after {
            content: "大米";
            width: 100px;
            height: 100px;
            background-color: pink;
            display: block;
        }
        .wh {
            color: aliceblue;
        }
    </style>
</head>
<body>
    <!-- 标签内容，老鼠爱大米 -->
     <div class="wh">爱</div>
</body>
</html>
<!-- - 伪元素  ::before/ ::after，**两个冒号**，生成新的虚拟盒子
- 伪类  :hover / :nth-child()，**一个冒号**，用来选中已经存在的元素 -->
