<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>网易新闻卡片</title>
    <style>
        .card {
            width: 300px;
            margin: 50px auto; 
            /* 上下外边距50px，左右auto → 卡片水平居中！这个很常用  */
            border: 1px solid #8a8a8a;
            /* 灰色实线边框*/
            padding: 10px;
            /* 内边距 */
            border-radius: 8px;
            /* 圆角 */
            box-shadow: 5px 5px 5px #eee;
            /* 盒子阴影 */
        }

        .card img {  
            width: 300px;
            height: auto;
            margin-bottom: 10px; 
            /* 底部外边距 */
        }
        .card h3 {
            font-size: 18px;
            font-weight: bold;
            /* bold加粗 */
            color: #333;
            margin-bottom: 8px;
        }
        .card p {
            font-size: 14px;
            color: #666;
            line-height: 1.6;
            text-indent: 2em;
            /* 首行缩进 */
        }
        .card a {
            font-size: 13px;
            color: #de2626;
            text-decoration: none;
            /* 去掉下划线 */
            text-align: right;
            /* 右对齐 */
            display: block;
            /* 块级元素，独占一行 */
        }
        .card a:hover {
            text-decoration: underline;
            color: #b01e1e;
        }
        
    </style>
</head>
<body>
    <div class="card">
        <img src="https://picsum.photos/300/200" alt="新闻图">
        <h3>人工智能改变未来生活</h3>
        <p>人工智能正在融入各行各业，悄悄改变我们的生活方式，带来许多全新的机遇与挑战。</p>
        <a href="https://www.163.com" target="_blank">阅读全文</a>
    </div>
    
</body>
</html>
