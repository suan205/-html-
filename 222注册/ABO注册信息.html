<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABO注册信息</title>
</head>
<body>
    <h1>ABO注册信息</h1>
    <form action="">
        <!-- 表单控件 -->
        <h2>个人信息</h2>
        <label>姓名：</label><input type="text" placeholder="请输入真实姓名">
        <br><br>
        <label>编号：</label><input type="password" placeholder="请输入密码"> 
        <br><br>
        <label>确认编号：</label><input type="password" placeholder="请输入确认密码"> 
        <br><br>
        <label>性别：</label>
        <label><input type="radio" name="gender"> omega</label>
        <input type="radio" name="gender" checked> alpha
        <input type="radio" name="gender" checked> beta

        <br><br>
        <label>居住城市：</label>
        <select>
            <option>京城</option>
            <option>A市</option>
            <option>p港</option>
            <option>海市</option>
            <option>南方城邦</option>
        </select>
        <h2>第二性别履历</h2>
        <label>第二性别分化等级：</label>
        <select>
            <option>S级</option>
            <option>A级</option>
            <option>B级</option>
            <option>C级</option>
        </select>
        <br><br>
        <label>信息素种类：</label><input type="text">
        <br><br>
        <label>信息素浓度：</label><input type="text">
        <br><br>
        <label>分化时间：</label>
        <select>
            <option>2015</option>
            <option>2016</option>
            <option>2017</option>
            <option>2018</option>
        </select>
        --
        <select>
            <option>2019</option>
            <option>2020</option>
            <option>2021</option>
            <option>2022</option>
        </select>
        <h2>过往羁绊经历</h2>
        <label>过往标记对象：</label><input type="text">
        <br><br>
        <label>羁绊经历描述：</label>
        <br>
        <textarea></textarea>
        <input type="checkbox"><label>已阅读并同意以下协议：</label>
        <ul>
            <li><a href="#">《ABO信息素管控条例》</a></li>
            <li><a href="#">《标记契约隐私法案》</a></li>
        </ul>
        <br><br>
        <button>完成注册</button>
        <button type="reset">重置填写</button>
    </form>
</body>
</html>
