<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS-特性-权重叠加-第一题</title>
    <!-- 权重格式：(行内样式个数, id选择器个数, 类选择器个数, 标签选择器个数)
    比较规则：从左向右依次比较个数，同一级个数多的优先；个数相同，向后继续比较
    !important 权重最高
    继承样式权重最低 -->
    <style>
        /* (0,0,2,1) */
        .c1 .c2 div {
            color: blue;
        }
        /* (0,1,0,1) */
        div #box3 {
            color: green;
        }
        /* (0,1,1,0) */
        #box1 .c3 {
            color: orange;
        }
    </style>
</head>
<body>
    <div id="box1" class="c1">
        <div id="box2" class="c2">
            <div id="box3" class="c3">
                这行文本是什么颜色的？
            </div>
        </div>
    </div>
</body>
</html>
