<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>层叠性</title>
    <style>
        /* 覆盖（相同的属性后面的生效）：叠加（不同属性叠加）*/
      div {
        color: red;
        font-size: 30px;
      }    
      
      div {
        color: green;
        font-weight: 700; 
      }
    </style>
</head>
<body>
    <div>div 标签</div>
</body>
</html>
